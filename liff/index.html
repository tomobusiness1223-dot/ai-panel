<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIパネル</title>
<style>
:root{--bg:#f6f7f5;--panel:#fff;--fg:#1d2420;--muted:#5f6b66;--line:#d9dfdb;--accent:#0f6e6e;--accent-soft:#d6ebea;--ok:#1d7a3e;--ng:#b23a2e;--ng-soft:#fbe9e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans JP",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:18px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=url],input[type=number],select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-block;font:inherit;font-weight:700;padding:11px 16px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer;width:100%;margin-top:12px}
.btn.sec{background:var(--accent-soft);color:var(--accent);width:auto;padding:8px 12px;margin:0}
.btn[disabled]{opacity:.5}
.prompt{background:var(--accent-soft);border-radius:8px;padding:12px;font-weight:700;margin:8px 0}
.steps{margin:0;padding-left:1.2em;font-size:14px}
.msg{padding:10px 12px;border-radius:8px;font-size:14px;margin-top:10px}
.msg.ng{background:var(--ng-soft);color:var(--ng)}
.msg.ok{background:var(--accent-soft);color:var(--ok)}
.pts{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.topic{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:0}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.done{background:#e6f1ea;color:var(--ok)}
.muted{color:var(--muted);font-size:13px}
.assure{margin:12px 0 0;color:var(--accent);font-weight:700;font-size:14px;line-height:1.6}
.radios label{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0;color:var(--fg);font-size:14px}
a.back{color:var(--accent);font-size:14px;display:inline-block;margin-bottom:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>AIパネル</h1>
  <p class="muted" id="who"></p>
  <div id="app"><p class="muted">読み込み中…</p></div>
</div>
<script>
const $=s=>document.querySelector(s);
let CFG={}, UID=null, IDTOKEN=null, ME=null, TOPICS=[];
const PREFS=["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
async function api(path,opt={}){
  const h={"Content-Type":"application/json"};
  if(IDTOKEN) h["Authorization"]="Bearer "+IDTOKEN; else if(UID) h["X-Dev-Uid"]=UID;
  const r=await fetch(path,{...opt,headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail||("エラー "+r.status));
  return j;
}
async function boot(){
  CFG=await (await fetch("/api/config",{cache:"no-store"})).json();
  // 古い画面が残っていたら読み込み直す（LINE 内ブラウザのキャッシュ対策）
  const MY_BUILD="__BUILD__";
  if(CFG.build && MY_BUILD!==CFG.build && !new URLSearchParams(location.search).has("v")){
    const u=new URL(location.href); u.searchParams.set("v",CFG.build); location.replace(u.toString()); return;
  }
  const isLocal=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if(CFG.liffId && !isLocal){
    await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://static.line-scdn.net/liff/edge/2/sdk.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    await liff.init({liffId:CFG.liffId});
    if(!liff.isLoggedIn()){liff.login();return;}
    IDTOKEN=liff.getIDToken();
  }else{
    try{UID=localStorage.getItem("devuid")}catch(e){}
    if(!CFG.devMode){window.scrollTo(0,0);$("#app").innerHTML=`<div class="msg ng">LINEから開いてください</div>`;return;}
    if(!UID){renderDevLogin();return;}
    $("#who").textContent="開発モード：ID "+UID;
  }
  await load();
}
function renderDevLogin(){
  window.scrollTo(0,0);$("#app").innerHTML=`<div class="card"><h2>開発モード</h2><p class="muted">LINE の代わりに、開発用のIDを入れてください（任意の文字列）。</p>
  <input type="text" id="devuid" placeholder="例: tester1"><button class="btn" id="devgo">はじめる</button></div>`;
  $("#devgo").onclick=()=>{const v=$("#devuid").value.trim();if(!v)return;try{localStorage.setItem("devuid",v)}catch(e){}UID=v;$("#who").textContent="開発モード：ID "+UID;load();};
}
async function load(){
  ME=await api("/api/me");
  if(!ME.registered){renderRegister();return;}
  TOPICS=await api("/api/topics");
  renderHome();
}
function renderRegister(){
  const yrs=[];for(let y=new Date().getFullYear()-18;y>=1930;y--)yrs.push(y);
  window.scrollTo(0,0);$("#app").innerHTML=`<div class="card"><h2>はじめに（1分）</h2>
  <p class="muted">この調査は、ChatGPTのおすすめが人によってどう違うかを調べるものです。あなたが提出した回答は、名前などを伏せたうえで集計に使います。</p>
  <label>性別</label><select id="gender"><option value="">選んでください</option><option value="female">女性</option><option value="male">男性</option><option value="other">その他・答えない</option></select>
  <label>生まれた年</label><select id="birth_year"><option value="">選んでください</option>${yrs.map(y=>`<option>${y}</option>`).join("")}</select>
  <label>お住まい</label><select id="prefecture"><option value="">選んでください</option>${PREFS.map(p=>`<option>${p}</option>`).join("")}</select>
  <label>同居している家族</label><select id="household"><option value="">選んでください</option><option value="single">一人暮らし</option><option value="couple">夫婦・パートナーと</option><option value="with_parents">親と</option><option value="family_kids">子どもと</option><option value="other">その他</option></select>
  <label>ChatGPTのプラン</label><select id="ai_plan"><option value="">選んでください</option><option value="free">無料</option><option value="paid">有料（Plus・Proなど）</option><option value="unknown">分からない</option></select>
  <label>ChatGPTのメモリ機能（あなたのことを覚えておく機能）</label><select id="memory_setting"><option value="">選んでください</option><option value="on">ONにしている</option><option value="off">OFFにしている</option><option value="unknown">分からない</option></select>
  <label>ChatGPTを使う頻度</label><select id="usage_freq"><option value="">選んでください</option><option value="daily">ほぼ毎日</option><option value="weekly_several">週に数回</option><option value="weekly">週1回くらい</option><option value="monthly">月に数回以下</option></select>
  <label>使い始めた時期</label><select id="started_at"><option value="">選んでください</option><option value="lt3m">3か月未満</option><option value="3m_1y">3か月〜1年</option><option value="gt1y">1年以上</option></select>
  <label>買い物やサービス選びで、ChatGPT に相談することはありますか</label><select id="shopping_ai_freq"><option value="">選んでください</option><option value="often">よくある</option><option value="sometimes">たまにある</option><option value="never">ほとんどない</option></select>
  <label>主に使う端末</label><select id="device"><option value="">選んでください</option><option value="iphone">iPhone</option><option value="android">Android</option><option value="pc">パソコン</option></select>
  <details style="margin-top:12px" id="consentbox"><summary style="cursor:pointer;color:var(--accent)">回答の利用目的と個人情報の取り扱い（全文）</summary>
  <div class="muted" style="font-size:13px;line-height:1.7;margin-top:8px">
  <p><b>この調査について</b><br>ChatGPT などの AI が、人によってどんな商品やサービスをおすすめするかを調べる調査です。あなたが AI に質問して得た回答を、ほかの参加者の回答と合わせて集計し、企業向けの調査レポートとして利用します。</p>
  <p><b>お預かりする情報</b><br>登録時の入力（性別、生まれた年、都道府県、同居家族、ChatGPT の利用状況）、提出いただく会話の共有リンクとその内容（AI の質問、あなたの答え、AI の回答、AI が参照したページ）、いま使っているブランドと買い替え予定、LINE のユーザー ID。氏名・電話番号・メールアドレス・住所は収集しません。会話に含まれていた場合は保存前に伏せ字にします。</p>
  <p><b>利用目的</b><br>(1) 属性別の推薦の集計と企業向けレポートの提供 (2) お題の案内、受付、ポイントの連絡 (3) 調査の仕組みの改善。</p>
  <p><b>企業に提供する範囲</b><br>人数で集計した結果と、個人を特定できない形に加工した会話の抜粋だけです。LINE の ID、登録情報そのもの、会話の全文は提供しません。</p>
  <p><b>保存と削除</b><br>会話は名前などを伏せたものを分析に使い、原文は暗号化して一定期間保存後に削除します。参加をやめたいときは LINE で「退会」と送ってください。登録情報と未集計の回答を削除します。集計済みの結果からは個人を取り出せないため削除できません。</p>
  <p><b>ポイント</b><br>受付できた提出1件につき、お題に表示されたポイントを付与します。受付できなかった提出には付与されません。交換先と条件は事前のお知らせのうえで変更することがあります。</p>
  <p><b>注意</b><br>共有リンクを作ると、その会話は URL を知っている人が閲覧できる状態になります。他人に見られたくない内容を含む会話は提出しないでください。提出後に会話を削除しても、受付時に保存した内容は上記の期間保持されます。ChatGPT のメモリ機能は OFF にする必要はありません。</p>
  </div></details>
  <div class="radios" style="margin-top:8px"><label><input type="checkbox" id="consent"> 上記の利用目的と個人情報の取り扱いに同意する</label></div>
  <button class="btn" id="reg">登録する</button><div id="regmsg"></div></div>`;
  $("#reg").onclick=async()=>{
    const ids=["gender","birth_year","prefecture","household","ai_plan","memory_setting","usage_freq","started_at","shopping_ai_freq","device"];
    const body={consent:$("#consent").checked};
    for(const k of ids){const v=$("#"+k).value;if(!v){$("#regmsg").innerHTML=`<div class="msg ng">すべての項目を選んでください</div>`;return;}body[k]=k==="birth_year"?Number(v):v;}
    try{await api("/api/register",{method:"POST",body});await load();}catch(e){$("#regmsg").innerHTML=`<div class="msg ng">${e.message}</div>`;}
  };
}
function renderHome(){
  const fmt=d=>d?new Date(d).toLocaleDateString("ja-JP"):"";
  const ordered=[...TOPICS.filter(t=>t.mode==="premise"),...TOPICS.filter(t=>t.mode!=="premise"&&t.mode!=="own")];
  const list=ordered.map(t=>{
    const done=t.status==="accepted"||t.status==="reference";
    const sub=t.mode==="premise"?`${t.point_value}ポイント・${t.resubmit_days}日ごとに更新できます${done?`（前回 ${fmt(t.last_submitted_at)}）`:""}`:`${t.point_value}ポイント`;
    const right=done&&t.can_resubmit?`<button class="btn sec" data-topic="${t.id}">更新する</button>`:done?`<span class="tag done">提出済み</span>`:t.status==="pending"?`<span class="tag">確認中</span>`:`<button class="btn sec" data-topic="${t.id}">やる</button>`;
    return `<div class="topic"><div><div><b>${t.category}</b></div><div class="muted">${sub}</div></div>${right}</div>`;}).join("");
  const own=TOPICS.find(t=>t.mode==="own");
  const code=ME.completion_code?`<div class="card" style="border-color:var(--accent)"><h2>すべてのお題が完了しました</h2><p class="muted">クラウドワークスなどから参加した方は、作業画面に次の完了コードを入力してください。</p><div class="pts" style="letter-spacing:.15em;font-family:ui-monospace,Menlo,monospace">${ME.completion_code}</div></div>`:
    `<div class="card"><div class="muted">お題の進み具合</div><div class="pts">${ME.required_done} / ${ME.required_total}</div><p class="muted" style="margin:4px 0 0">すべて終わると、作業の完了コードが表示されます。</p></div>`;
  window.scrollTo(0,0);$("#app").innerHTML=`<div class="card"><div class="muted">ポイント</div><div class="pts">${ME.points}</div></div>${code}
  <div class="card"><h2>今週のお題</h2>${list||'<p class="muted">いまは受付中のお題がありません。</p>'}</div>
  ${own?`<div class="card"><h2>AIに相談して買い物やサービス選びをしたことがある方へ</h2><p class="muted">過去に ChatGPT に相談して、何かを買った・契約した・検討した会話があれば、その会話を共有してください。お題とは別に、何件でも提出できます。ジャンルにより60〜150ポイント／件。</p><button class="btn sec" id="ownbtn">会話を提出する</button></div>`:''}`;
  document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{const t=TOPICS.find(x=>x.id===Number(b.dataset.topic)); t.mode==="premise"?renderPremise(t):renderSubmit(t.id);});
  if(own){$("#ownbtn").onclick=()=>renderOwn(own);}
}
async function renderSubmit(tid){
  const t=TOPICS.find(x=>x.id===tid);
  const brands=await api("/api/brands?category_key="+t.category_key);
  window.scrollTo(0,0);$("#app").innerHTML=`<a class="back" href="#" id="back">← お題一覧</a><div class="card"><h2>${t.category}</h2>
  <ol class="steps"><li>ChatGPTで<b>新しいチャット</b>を開く（一時チャットは不可）</li><li>下の質問文をそのまま送る。<b>文言は変えない</b></li>${t.mode==="dialog"?'<li>ChatGPT が最初のおすすめを出し、そのあと質問してきます。<b>質問に普段どおり答える</b>（何往復でもOK）</li><li>答えを踏まえた<b>2回目のおすすめが出たら</b>、画面上の「共有」からリンクを作り、下に貼る</li>':'<li>回答が出たら、画面上の「共有」からリンクを作り、下に貼る</li>'}</ol>
  <div class="prompt" id="ptxt">${t.prompt_text}</div><button class="btn sec" id="copy">質問文をコピー</button>
  ${t.mode==="dialog"?'<p class="assure">共有リンクは、質問に答えて2回目のおすすめが出たあとに作ってください。先に作ると、そのあとのやり取りがリンクに入りません。</p><p class="muted" style="margin-top:6px">ChatGPT から質問が来なかった場合は、最初のおすすめのまま共有して大丈夫です。質問に答えたくないときは「おまかせします。おすすめを教えてください。」と送ってください。</p>':'<p class="muted" style="margin-top:8px">おすすめが出ずに質問だけ返ってきたら、同じチャットで「おまかせします。おすすめを5つ教えてください。」と1回だけ送ってください。</p>'}
  <label>共有リンク（chatgpt.com/share/… で始まるURL）</label><input type="url" id="link" placeholder="https://chatgpt.com/share/…" inputmode="url"><div id="linkmsg"></div>
  <label>いま使っている${t.category}のブランド（なければ「なし」）</label><input type="text" id="own" list="brandlist" placeholder="例: ${brands[0]||""}"><datalist id="brandlist">${brands.map(b=>`<option value="${b}">`).join("")}</datalist>
  <label>3か月以内に、新しく買う・乗り換える予定はありますか</label><div class="radios"><label><input type="radio" name="intent" value="yes">ある</label><label><input type="radio" name="intent" value="no">ない</label><label><input type="radio" name="intent" value="unknown">分からない</label></div>
  <button class="btn" id="send">提出する</button><div id="msg"></div></div>`;
  $("#back").onclick=e=>{e.preventDefault();load();};
  $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(t.prompt_text);$("#copy").textContent="コピーしました";}catch(e){const r=document.createRange();r.selectNodeContents($("#ptxt"));getSelection().removeAllRanges();getSelection().addRange(r);$("#copy").textContent="選択しました。長押しでコピー";}};
  const SHARE=/^https:\/\/chatgpt\.com\/(share\/[0-9a-f-]{20,}|s\/t_[A-Za-z0-9_-]{6,})\/?$/;
  $("#link").oninput=()=>{const v=$("#link").value.trim();if(!v){$("#linkmsg").innerHTML="";return;}
    if(SHARE.test(v))$("#linkmsg").innerHTML=`<div class="msg ok">リンクの形式はOKです</div>`;
    else if(/chatgpt\.com\/c\//.test(v))$("#linkmsg").innerHTML=`<div class="msg ng">それは本人しか開けないURLです。画面の「共有」ボタンからリンクを作ってください。</div>`;
    else $("#linkmsg").innerHTML=`<div class="msg ng">chatgpt.com/share/… で始まるURLを貼ってください。</div>`;};
  $("#send").onclick=async()=>{
    const link=$("#link").value.trim();const intent=(document.querySelector("input[name=intent]:checked")||{}).value;
    if(!SHARE.test(link)){$("#msg").innerHTML=`<div class="msg ng">共有リンクを確認してください</div>`;return;}
    if(!intent){$("#msg").innerHTML=`<div class="msg ng">購入予定を選んでください</div>`;return;}
    $("#send").disabled=true;$("#msg").innerHTML=`<div class="msg ok">回答を確認しています（10〜30秒）…</div>`;
    try{const r=await api("/api/submissions",{method:"POST",body:{topic_id:tid,link_url:link,own_brand_text:$("#own").value,intent}});poll(r.id);}
    catch(e){$("#send").disabled=false;$("#msg").innerHTML=`<div class="msg ng">${e.message}</div>`;}
  };
}
async function poll(id, opts={}){
  for(let i=0;i<40;i++){
    await new Promise(r=>setTimeout(r,2000));
    const s=await api("/api/submissions/"+id);
    if(s.accept_status==="accepted"||s.accept_status==="reference"){
      if(opts.noReaction||!(s.mentions||[]).length||s.intent!=="yes"){   // 気になった商品は、購入予定が「ある」人にだけ聞く
        $("#msg").innerHTML=`<div class="msg ok">受付しました。ポイントを付与しました。${(s.brands||[]).length?`<br><span class="muted">読み取ったおすすめ：${s.brands.join("、")}</span>`:''}</div><button class="btn" id="home">お題一覧へ</button>`;$("#home").onclick=()=>load();return;
      }
      renderReaction(s); return;
    }
    if(s.accept_status==="rejected"){$("#msg").innerHTML=`<div class="msg ng">${s.reject_reason}</div>`;$("#send").disabled=false;return;}
  }
  $("#msg").innerHTML=`<div class="msg ng">確認に時間がかかっています。あとで「お題一覧」から状態を確認してください。</div>`;
}
function renderReaction(s){
  window.scrollTo(0,0);
  $("#msg").innerHTML=`<div class="msg ok">受付しました。ポイントを付与しました。</div>
  <div style="margin-top:12px"><b>購入の予定がある方に、最後に2つだけ</b></div>
  <label>ChatGPT の提案のうち、いちばん気になったものはどれですか</label>
  <div class="radios" style="display:flex;flex-direction:column">${s.mentions.map(m=>`<label><input type="radio" name="pick" value="${m.id}">${m.rank?m.rank+"位 ":""}${m.label}</label>`).join("")}<label><input type="radio" name="pick" value="none">気になるものはなかった</label></div>
  <label>その商品・サービスの、どこに魅力を感じましたか。どんな商品だと受け取り、どこが自分に合うと思ったかを書いてください</label><textarea id="rxtext" rows="3"></textarea>
  <button class="btn" id="rxsend">送信して終わる</button><div id="rxmsg"></div>`;
  $("#msg").scrollIntoView({block:"start"});
  $("#rxsend").onclick=async()=>{
    const pick=(document.querySelector("input[name=pick]:checked")||{}).value;
    if(!pick){$("#rxmsg").innerHTML=`<div class="msg ng">気になったものを選んでください</div>`;return;}
    try{await api("/api/submissions/"+s.id+"/reaction",{method:"POST",body:{picked_mention_id:pick==="none"?null:Number(pick),picked_none:pick==="none",reason_text:$("#rxtext").value}});load();}
    catch(e){$("#rxmsg").innerHTML=`<div class="msg ng">${e.message}</div>`;}
  };
}
function renderPremise(t){
  window.scrollTo(0,0);$("#app").innerHTML=`<a class="back" href="#" id="back">← お題一覧</a><div class="card"><h2>${t.category}</h2>
  <p class="muted">ChatGPT があなたについて何を覚えていて、買い物やサービス選びの相談でどう使っているかを調べるお題です。${t.resubmit_days}日ごとに更新でき、変化を追えます。</p>
  <ol class="steps"><li>ChatGPTで<b>新しいチャット</b>を開く（一時チャットは不可）</li><li>下の質問文をそのまま送る</li><li>回答を読んで、<b>出してよいと思えたら</b>「共有」からリンクを作り、下に貼る</li></ol>
  <div class="prompt" id="ptxt">${t.prompt_text}</div><button class="btn sec" id="copy">質問文をコピー</button>
  <div class="assure">個人が特定されるような情報は一切使用せず、分析に使われることはありません。</div>
  <p class="muted" style="margin-top:8px">出したくない内容が含まれていれば、提出せずに「お題一覧」に戻ってください。</p>
  <label>共有リンク（chatgpt.com/share/… で始まるURL）</label><input type="url" id="link" placeholder="https://chatgpt.com/share/…" inputmode="url"><div id="linkmsg"></div>
  <button class="btn" id="send">提出する</button><div id="msg"></div></div>`;
  $("#back").onclick=e=>{e.preventDefault();load();};
  $("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(t.prompt_text);$("#copy").textContent="コピーしました";}catch(e){const r=document.createRange();r.selectNodeContents($("#ptxt"));getSelection().removeAllRanges();getSelection().addRange(r);$("#copy").textContent="選択しました。長押しでコピー";}};
  const SHARE=/^https:\/\/chatgpt\.com\/(share\/[0-9a-f-]{20,}|s\/t_[A-Za-z0-9_-]{6,})\/?$/;
  $("#send").onclick=async()=>{const link=$("#link").value.trim(); if(!SHARE.test(link)){$("#msg").innerHTML=`<div class="msg ng">chatgpt.com/share/… で始まるURLを貼ってください</div>`;return;}
    $("#send").disabled=true;$("#msg").innerHTML=`<div class="msg ok">回答を確認しています…</div>`;
    try{const r=await api("/api/submissions",{method:"POST",body:{topic_id:t.id,link_url:link}});poll(r.id,{noReaction:true});}catch(e){$("#send").disabled=false;$("#msg").innerHTML=`<div class="msg ng">${e.message}</div>`;}};
}
const APPEAL=[["price","価格・料金が手頃だった"],["spec","成分・性能・機能・内容が良さそうだった"],["review","口コミ・評価が良かった"],["brand","知っているブランド・会社だった"],["access","買いやすかった・申し込みやすかった"],["fit","自分の条件に合っていた"],["other","その他"]];
const REJECT=[["price","高かった"],["info","情報が足りなかった"],["trust","信用できなかった"],["store","店や人に別のものを勧められた"],["undecided","まだ迷っている"],["noneed","必要なくなった"],["other","その他"]];
async function renderOwn(t){
  const G=await api("/api/genres");
  window.scrollTo(0,0);$("#app").innerHTML=`<a class="back" href="#" id="back">← 戻る</a><div class="card"><h2>AIに相談した買い物・サービス選びの会話</h2>
  <p class="muted">過去に ChatGPT に相談して、何かを買った・契約した・検討した会話を共有してください。質問文の指定はありません。相談の内容そのままで大丈夫です。</p>
  <label>何についての相談でしたか（大分類）</label><select id="ogroup"><option value="">選んでください</option>${G.groups.map((g,i)=>`<option value="${i}">${g.name}</option>`).join("")}<option value="__other">その他</option></select>
  <label id="oitem_label" hidden>詳しい種類</label><select id="oitem" hidden></select>
  <input type="text" id="ocat_other" placeholder="例：炊飯器、転職エージェント" style="margin-top:6px" hidden>
  <div class="muted" id="opts" style="margin-top:6px"></div>
  <ol class="steps" style="margin-top:12px"><li>ChatGPT の履歴からその会話を開く</li><li>画面上の「共有」からリンクを作り、下に貼る</li></ol>
  <p class="muted">他人に見られたくない内容が含まれる会話は提出しないでください。名前などはこちらで伏せ字にします。</p>
  <label>共有リンク</label><input type="url" id="link" placeholder="https://chatgpt.com/share/…" inputmode="url"><div id="linkmsg"></div>
  <label>相談した結果</label><div class="radios"><label><input type="radio" name="outcome" value="bought">買った・契約した</label><label><input type="radio" name="outcome" value="considering">検討中</label><label><input type="radio" name="outcome" value="not_bought">買わなかった</label></div>
  <label>買った（または選んだ）もの。なければ空欄</label><input type="text" id="chosen" placeholder="商品名・ブランド名・サービス名">
  <label>ChatGPT に相談する前から、その商品・サービスを知っていましたか</label><div class="radios" style="display:flex;flex-direction:column"><label><input type="radio" name="knew" value="considered">知っていて、候補に入れていた</label><label><input type="radio" name="knew" value="name_only">名前は知っていた</label><label><input type="radio" name="knew" value="unknown">知らなかった</label></div>
  <label>その商品・サービスの、どこに魅力を感じましたか。ChatGPT の説明を読んで、どんな商品だと受け取り、どこが自分に合うと思ったかを、具体的に書いてください</label><textarea id="appeal" rows="3"></textarea>
  <label>ChatGPT が挙げたほかの候補のうち、いちばん迷ったもの（なければ「なし」）</label><input type="text" id="runner" placeholder="商品名・ブランド名・サービス名">
  <label>その候補を選ばなかった理由を、具体的に書いてください。その商品・サービスのどこが自分に合わないと感じましたか（何も買わなかった方は、挙がった候補のどこが決め手に欠けたかを書いてください）</label><textarea id="reject" rows="3"></textarea>
  <button class="btn" id="send">提出する</button><div id="msg"></div></div>`;
  $("#back").onclick=e=>{e.preventDefault();load();};
  const showPts=()=>{const g=$("#ogroup").value; if(g==="__other"){$("#opts").textContent=`${G.other_points}ポイント`;return;} const it=G.groups[g]?.items.find(x=>x.key===$("#oitem").value); $("#opts").textContent=it?`${it.points}ポイント`:"";};
  $("#ogroup").onchange=()=>{const g=$("#ogroup").value; const other=g==="__other"; $("#ocat_other").hidden=!other; $("#oitem").hidden=$("#oitem_label").hidden=other||!g;
    if(!other&&g){$("#oitem").innerHTML=`<option value="">選んでください</option>`+G.groups[g].items.map(x=>`<option value="${x.key}">${x.name}</option>`).join("");} showPts();};
  $("#oitem").onchange=showPts;
  const SHARE=/^https:\/\/chatgpt\.com\/(share\/[0-9a-f-]{20,}|s\/t_[A-Za-z0-9_-]{6,})\/?$/;
  $("#send").onclick=async()=>{
    const g=$("#ogroup").value; const other=g==="__other"; const genre_key=other?"other":$("#oitem").value; const own_category=other?$("#ocat_other").value.trim():"";
    const link=$("#link").value.trim(); const outcome=(document.querySelector("input[name=outcome]:checked")||{}).value;
    if(!g||(!other&&!genre_key)||(other&&!own_category)){$("#msg").innerHTML=`<div class="msg ng">何についての相談かを選んでください</div>`;return;}
    if(!SHARE.test(link)){$("#msg").innerHTML=`<div class="msg ng">chatgpt.com/share/… で始まるURLを貼ってください</div>`;return;}
    if(!outcome){$("#msg").innerHTML=`<div class="msg ng">相談した結果を選んでください</div>`;return;}
    const knew=(document.querySelector("input[name=knew]:checked")||{}).value;
    if(!knew){$("#msg").innerHTML=`<div class="msg ng">相談する前から知っていたかを選んでください</div>`;return;}
    if($("#appeal").value.trim().length<5&&outcome!=="not_bought"){$("#msg").innerHTML=`<div class="msg ng">どこに魅力を感じたかを書いてください</div>`;return;}
    $("#send").disabled=true;$("#msg").innerHTML=`<div class="msg ok">会話を確認しています…</div>`;
    try{const r=await api("/api/submissions",{method:"POST",body:{topic_id:t.id,link_url:link,genre_key,own_category,outcome,chosen_text:$("#chosen").value,knew_before:knew,appeal_text:$("#appeal").value,runner_up_text:$("#runner").value,rejection_text:$("#reject").value}});poll(r.id,{noReaction:true});}
    catch(e){$("#send").disabled=false;$("#msg").innerHTML=`<div class="msg ng">${e.message}</div>`;}
  };
}
boot().catch(e=>{window.scrollTo(0,0);$("#app").innerHTML=`<div class="msg ng">${e.message}</div>`});
