services:
  - type: web
    name: ai-panel
    runtime: docker
    plan: free   # 本番前に starter に変更し、disk（/app/data）を追加する。free はデータが再デプロイで消える
    autoDeploy: true
    envVars:
      - key: DEV_MODE
        value: "0"
      - key: LINE_CHANNEL_ID
        value: "2011920187"
      - key: LIFF_ID
        value: "2011920187-5XCmOIeW"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: RAW_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
